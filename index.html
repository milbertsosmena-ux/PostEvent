<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landmark Event Voice Interviewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 550px;
      width: 100%;
      padding: 32px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; color: #2c3e50; margin-bottom: 8px; }
    p.subtitle { color: #666; font-size: 0.95rem; margin-bottom: 24px; }
    .status-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      min-height: 100px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    .btn:hover { background-color: #1d4ed8; }
    .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    .pulse {
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #ef4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse-animation 1.5s infinite;
    }
    @keyframes pulse-animation {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Landmark Insights Interview</h1>
  <p class="subtitle">Voice-Guided Reflection & Feedback</p>
  
  <div class="status-box" id="displayBox">
    <em>Click "Start Interview" to begin. Please grant microphone access when prompted.</em>
  </div>

  <button class="btn" id="actionBtn" onclick="startInterview()">Start Interview</button>
</div>

<script>
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
  const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

  const questions = [
    { key: "q1", text: "Hi, how was your experience? Is there anything that would make your experience better?" },
    { key: "q2", text: "Looking at the lessons you learned, what do you think would make those lessons directly applicable in your life?" },
    { key: "q3", text: "How have you applied similar lessons or principles in your life before?" },
    { key: "q4", text: "Can you share examples of how you have used production skills—such as operational skills based on intention, intelligence, alacrity, integrity, or zen—in your life?" }
  ];

  let currentStep = 0;
  let responses = {};
  let recognition;
  let synth = window.speechSynthesis;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
  } else {
    alert("Speech recognition is not supported in this browser. Please use Chrome or Safari.");
  }

  function startInterview() {
    document.getElementById('actionBtn').disabled = true;
    currentStep = 0;
    responses = {};
    askQuestion();
  }

  function speakText(text, callback) {
    updateDisplay("<strong>Interviewer:</strong> " + text);
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.95;
    utterance.onend = function() {
      if (callback) callback();
    };
    synth.speak(utterance);
  }

  function askQuestion() {
    if (currentStep < questions.length) {
      speakText(questions[currentStep].text, function() {
        startListening();
      });
    } else {
      finishInterview();
    }
  }

  function startListening() {
    let finalTranscript = '';
    updateDisplay('<span class="pulse"></span><strong>Listening... Speak now. Click "Next Question" when finished.</strong>');
    
    // Provide a manual button to advance
    const btn = document.getElementById('actionBtn');
    btn.disabled = false;
    btn.innerText = "Next Question";
    btn.onclick = function() {
      recognition.stop();
      responses[questions[currentStep].key] = finalTranscript;
      currentStep++;
      btn.disabled = true;
      btn.innerText = "Processing...";
      askQuestion();
    };

    recognition.onresult = function(event) {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalTranscript += event.results[i][0].transcript + ' ';
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      updateDisplay('<span class="pulse"></span><strong>Listening:</strong> ' + finalTranscript + ' <em>' + interim + '</em>');
    };

    recognition.start();
  }

  function finishInterview() {
    updateDisplay("Thank you! Saving your responses to Google Drive...");
    const payload = {
      participantId: "Participant_" + Math.floor(1000 + Math.random() * 9000),
      responses: responses
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      speakText("Thank you for sharing your experience. Your responses have been saved.", function() {
        updateDisplay("<strong>Interview Complete!</strong> Your responses have been uploaded.");
        const btn = document.getElementById('actionBtn');
        btn.disabled = false;
        btn.innerText = "Start New Interview";
        btn.onclick = function() { location.reload(); };
      });
    })
    .catch(err => {
      updateDisplay("Error saving response. Please try again.");
      console.error(err);
    });
  }

  function updateDisplay(html) {
    document.getElementById('displayBox').innerHTML = html;
  }
</script>

</body>
</html>
